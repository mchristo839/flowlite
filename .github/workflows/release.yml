# Builds FlowLite for Android, Linux, Windows and Mac (Apple Silicon and Intel).
#
# Push a tag like v0.2.0 to build both apps and publish them on the Releases page.
# Installed apps check that page and offer the update.
# "Run workflow" by hand builds both apps without publishing, to test a change.
#
# Repository secrets (Settings, Secrets and variables, Actions):
#   ANDROID_KEYSTORE_B64  base64 of the Android signing keystore. Every installed copy carries
#                         this key, and Android installs an update only when the key matches.
#   FLOWLITE_RELEASE_KEY  contents of the Linux release key (tauri signer). The Linux app accepts
#                         only releases signed with it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      handy_ref:
        description: "Branch of the Linux app (Handy fork) to build"
        default: sync

permissions:
  contents: write

env:
  HANDY_REPO: mchristo839/Handy
  HANDY_REF: ${{ inputs.handy_ref || 'sync' }}
  # Version codes are minutes since 2026-01-01, so every build installs over the previous one.
  EPOCH: "1767225600"

jobs:
  # One build number for every desktop app in a release, so each compares against the same manifests.
  prep:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.n.outputs.build }}
      version: ${{ steps.n.outputs.version }}
    steps:
      - id: n
        run: |
          echo "build=$(( ($(date +%s) - EPOCH) / 60 ))" >> "$GITHUB_OUTPUT"
          VERSION=${GITHUB_REF_NAME#v}
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION=0.0.0-test ;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing. Releases must carry the same key as installed copies."
            exit 1
          fi
          mkdir -p keys
          echo "$KEYSTORE" | base64 -d > keys/android-debug.keystore

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        working-directory: android
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION=0.0.0-test ;; esac
          ./gradlew --no-daemon assembleRelease -PflowliteVersion="$VERSION"

      - name: Package
        run: |
          APK_IN=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          CODE=$("$AAPT" dump badging "$APK_IN" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NAME=$("$AAPT" dump badging "$APK_IN" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          mkdir -p out
          APK="flowlite-$NAME.apk"
          cp "$APK_IN" "out/$APK"
          SHA=$(sha256sum "out/$APK" | cut -d' ' -f1)
          python3 - "$CODE" "$NAME" "$SHA" "$GITHUB_REF_NAME" "$APK" > out/flowlite-android.json <<'EOF'
          import json, sys
          code, name, sha, tag, apk = sys.argv[1:]
          print(json.dumps({"version_code": int(code), "version_name": name, "sha256": sha, "tag": tag, "apk": apk}))
          EOF
          cat out/flowlite-android.json

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  linux:
    needs: prep
    runs-on: ubuntu-24.04
    env:
      FLOWLITE_BUILD: ${{ needs.prep.outputs.build }}
      VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Linux app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HANDY_REPO }}
          ref: ${{ env.HANDY_REF }}
          path: Handy

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: "./Handy/src-tauri -> target"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev glslc spirv-headers glslang-tools libvulkan-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdotool \
            libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell0 libgtk-layer-shell-dev

      - name: Build .deb
        working-directory: Handy
        run: |
          bun install
          bun run tauri build --bundles deb --config src-tauri/tauri.flowlite.conf.json --config "{\"version\":\"$VERSION\"}"

      # Debug build, as upstream Handy's own test workflow runs it. A release-profile test build
      # failed to link ONNX Runtime. Mac is the slowest job, so this adds no time to a release.
      - name: Sync and update tests
        working-directory: Handy/src-tauri
        run: cargo test --lib flowlite_sync

      - name: Sign and package
        env:
          RELEASE_KEY: ${{ secrets.FLOWLITE_RELEASE_KEY }}
        run: bash .github/sign-desktop.sh linux Handy/src-tauri/target/release/bundle/deb/FlowLite_*_amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  # Windows steps follow upstream Handy's build.yml: baseline ONNX Runtime (runs on older CPUs),
  # Vulkan SDK and SPIRV headers for GPU Whisper, and the VC++ runtime bundled next to the app.
  windows:
    needs: prep
    runs-on: windows-2022
    env:
      FLOWLITE_BUILD: ${{ needs.prep.outputs.build }}
      VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Check out the desktop app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HANDY_REPO }}
          ref: ${{ env.HANDY_REF }}
          path: Handy

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: "./Handy/src-tauri -> target"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff  # v1.2
        with:
          version: 1.4.309.0
          cache: true

      # Microsoft's NuGet package of the official build. The GitHub release download that upstream
      # Handy uses returned 404 on 18 Nov 2026. The checksum pins the exact file.
      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = "1.24.2"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$v/microsoft.ml.onnxruntime.$v.nupkg" -OutFile ort.zip
          $sha = (Get-FileHash ort.zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "782564d3d68e87269ea1812cc94710ad06fe014faf093f01a6f89d0bd58719d3") { throw "ONNX Runtime checksum mismatch: $sha" }
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $lib = (Resolve-Path "ort-dist/runtimes/win-x64/native").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$lib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      - name: Install SPIRV headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$prefix"

      - name: Locate VC++ runtime to bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $ver = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $arch = Join-Path $vsRoot "VC\Redist\MSVC\$ver\x64"
          $crt = Get-ChildItem $arch -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $arch -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not $omp) { throw "VC++ redist not found under $arch" }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - name: Build installer
        working-directory: Handy
        shell: bash
        run: |
          bun install
          bun run tauri build --bundles nsis --config src-tauri/tauri.flowlite.conf.json --config "{\"version\":\"$VERSION\"}"

      - name: Sign and package
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.FLOWLITE_RELEASE_KEY }}
        run: bash .github/sign-desktop.sh windows Handy/src-tauri/target/release/bundle/nsis/FlowLite_*_x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  # Apple Silicon Macs. The Intel build is the macos-intel job below.
  # Built on an Intel runner for the arm64 target: GitHub's arm64 Mac runners are often out of capacity.
  # Not notarised: the app is ad-hoc signed, so macOS asks people to allow it once.
  macos:
    needs: prep
    runs-on: macos-15-intel
    env:
      FLOWLITE_BUILD: ${{ needs.prep.outputs.build }}
      VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the desktop app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HANDY_REPO }}
          ref: ${{ env.HANDY_REF }}
          path: Handy

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: "./Handy/src-tauri -> target"

      - name: Build disk image
        working-directory: Handy
        run: |
          bun install
          bun run tauri build --target aarch64-apple-darwin --bundles dmg --config src-tauri/tauri.flowlite.conf.json --config "{\"version\":\"$VERSION\"}"

      - name: Sign and package
        env:
          RELEASE_KEY: ${{ secrets.FLOWLITE_RELEASE_KEY }}
        run: bash .github/sign-desktop.sh macos Handy/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/FlowLite_*_aarch64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/

  # Intel Macs, built natively.
  macos-intel:
    needs: prep
    runs-on: macos-15-intel
    env:
      FLOWLITE_BUILD: ${{ needs.prep.outputs.build }}
      VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the desktop app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HANDY_REPO }}
          ref: ${{ env.HANDY_REF }}
          path: Handy

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: "./Handy/src-tauri -> target"

      # Microsoft no longer publishes an Intel Mac build of ONNX Runtime. This is upstream Handy's
      # own build, the one its Intel Mac release uses. The checksum pins the exact file.
      - name: Install ONNX Runtime
        run: |
          V=1.24.2
          curl -fsSL -o ort.tgz "https://blob.handy.computer/onnxruntime-osx-x86_64-$V.tgz"
          echo "590cee05699047b85e4a8115b4cec792073c2972ce78de383356a552a296a9c4  ort.tgz" | shasum -a 256 -c -
          tar xzf ort.tgz
          DIR="$PWD/onnxruntime-osx-x86_64-$V"
          echo "ORT_LIB_LOCATION=$DIR/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          jq --arg lib "$DIR/lib/libonnxruntime.$V.dylib" '.bundle.macOS.frameworks = [$lib]' \
            Handy/src-tauri/tauri.conf.json > tmp.json && mv tmp.json Handy/src-tauri/tauri.conf.json

      - name: Build disk image
        working-directory: Handy
        run: |
          bun install
          bun run tauri build --bundles dmg --config src-tauri/tauri.flowlite.conf.json --config "{\"version\":\"$VERSION\"}"

      - name: Sign and package
        env:
          RELEASE_KEY: ${{ secrets.FLOWLITE_RELEASE_KEY }}
        run: bash .github/sign-desktop.sh macos-x64 Handy/src-tauri/target/release/bundle/dmg/FlowLite_*_x64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: out/

  # Android and Linux must build. Windows and Mac publish when they built, so a GitHub runner
  # shortage (common for Mac) does not hold up a release. Their apps keep the previous version.
  publish:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.linux.result == 'success'
    needs: [android, linux, windows, macos, macos-intel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: shopt -s nullglob && sha256sum *.apk *.deb *.exe *.dmg > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Android:** download the `.apk` below on your phone and open it. Allow "Install unknown apps" for your browser when asked.

          **Linux (Debian, Ubuntu, Mint):** download the `.deb`, then run `sudo apt install ./FlowLite_*.deb`

          **Windows 10 and 11:** download the `-setup.exe` and run it. If Windows SmartScreen warns you, click **More info**, then **Run anyway**.

          **Mac:** download `FlowLite_*_aarch64.dmg` for Apple Silicon (M1 or newer) or `FlowLite_*_x64.dmg` for Intel Macs, open it and drag FlowLite to Applications. On first launch macOS blocks it: open System Settings, Privacy & Security, scroll down and click **Open Anyway**.

          Installed apps find this release by themselves and offer to update.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "FlowLite $GITHUB_REF_NAME" --notes-file notes.md

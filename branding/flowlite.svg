<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A6CF0"/>
      <stop offset="1" stop-color="#1C2A80"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EE36B"/>
      <stop offset="1" stop-color="#3FB34F"/>
    </linearGradient>
    <clipPath id="head"><circle cx="440" cy="440" r="230"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- body and tail -->
  <path d="M250 520 C 230 700 300 850 420 900 L 360 1024 L 470 1024 L 520 905 C 620 870 680 760 670 600 Z" fill="url(#body)"/>
  <path d="M330 640 C 360 700 400 740 450 760" fill="none" stroke="#2E8F3E" stroke-width="22" stroke-linecap="round"/>
  <path d="M320 720 C 350 780 400 810 450 830" fill="none" stroke="#2E8F3E" stroke-width="22" stroke-linecap="round"/>

  <!-- head: yellow face with barred crown -->
  <circle cx="440" cy="440" r="230" fill="#FFE45C"/>
  <g clip-path="url(#head)" fill="none" stroke="#3A3A2E" stroke-width="20" stroke-linecap="round">
    <path d="M220 300 C 300 260 380 250 440 262"/>
    <path d="M214 360 C 290 318 360 306 420 312"/>
    <path d="M216 420 C 280 384 330 372 380 374"/>
  </g>

  <!-- eye -->
  <circle cx="520" cy="400" r="40" fill="#1E1E1E"/>
  <circle cx="533" cy="386" r="13" fill="#FFFFFF"/>

  <!-- cere and hooked beak -->
  <ellipse cx="628" cy="452" rx="40" ry="26" fill="#3B82F6"/>
  <path d="M600 470 C 650 455 720 470 735 520 C 745 560 720 600 690 612 C 700 580 690 548 660 540 C 630 534 605 520 600 470 Z" fill="#F4A259"/>

  <!-- throat spots -->
  <circle cx="470" cy="610" r="17" fill="#1E1E1E"/>
  <circle cx="540" cy="596" r="17" fill="#1E1E1E"/>
  <circle cx="400" cy="604" r="17" fill="#1E1E1E"/>

  <!-- voice waves -->
  <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round">
    <path d="M790 470 C 815 505 815 555 790 590"/>
    <path d="M865 420 C 910 485 910 590 865 650"/>
  </g>
</svg>
